backend:
  name: git-gateway
  branch: main

locale: "ru"

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "content"
    label: "Контент сайта"
    files:

      - file: "content.json"
        label: "Контакты, фото и тексты"
        name: "main"
        fields:

          - label: "Контакты"
            name: "contact"
            widget: "object"
            fields:
              - {label: "Телефон", name: "phone", widget: "string"}
              - {label: "Email", name: "email", widget: "string"}
              - {label: "Ссылка на Instagram", name: "instagram", widget: "string"}
              - {label: "Instagram — текст (напр. @emlak.arenda)", name: "instagramHandle", widget: "string"}
              - {label: "Ссылка на TikTok", name: "tiktok", widget: "string"}
              - {label: "TikTok — текст (напр. @emlak.arenda)", name: "tiktokHandle", widget: "string"}
              - {label: "Ссылка на Telegram", name: "telegram", widget: "string"}
              - {label: "Telegram — текст (напр. @emlak_arenda)", name: "telegramHandle", widget: "string"}

          - label: "Фото"
            name: "images"
            widget: "object"
            fields:
              - {label: "Главное фото (первый экран)", name: "hero", widget: "image"}
              - {label: "Фото в разделе «О нас»", name: "about", widget: "image"}

          - label: "Тексты по языкам"
            name: "translations"
            widget: "object"
            fields:

              - label: "Азербайджанский (AZ)"
                name: "az"
                widget: "object"
                fields: &text_fields
                  - {label: "Метка над заголовком", name: "hero.eyebrow", widget: "string"}
                  - {label: "Главный заголовок (можно <br> и <i>...</i>)", name: "hero.h1", widget: "text"}
                  - {label: "Описание под заголовком", name: "hero.p", widget: "text"}
                  - {label: "Кнопка 1 (Смотреть объекты)", name: "hero.btn1", widget: "string"}
                  - {label: "Кнопка 2 (Сдать недвижимость)", name: "hero.btn2", widget: "string"}
                  - {label: "Локация на карточке цены (первый экран)", name: "hero.price_loc", widget: "string"}
                  - {label: "Единица цены (напр. «/ мес»)", name: "hero.price_unit", widget: "string"}
                  - {label: "О нас — абзац 1", name: "about.p1", widget: "text"}
                  - {label: "О нас — абзац 2", name: "about.p2", widget: "text"}
                  - {label: "О нас — заметка внизу", name: "about.note", widget: "text"}
                  - {label: "Адрес офиса (текст)", name: "contact.addr_v", widget: "string"}
                  - {label: "Часы работы (текст)", name: "contact.hours_v", widget: "string"}
                  - {label: "Реклама — метка", name: "ad.label", widget: "string"}
                  - {label: "Реклама — заголовок", name: "ad.h3", widget: "string"}
                  - {label: "Реклама — текст", name: "ad.p", widget: "text"}

              - label: "Русский (RU)"
                name: "ru"
                widget: "object"
                fields: *text_fields

              - label: "Английский (EN)"
                name: "en"
                widget: "object"
                fields: *text_fields

          - label: "Объекты (квартиры / офисы / дома)"
            name: "listings"
            widget: "list"
            summary: "{{fields.az.title}} — {{fields.price}} {{fields.currency}}"
            fields:
              - {label: "Тип объекта", name: "type", widget: "select", options: ["apartment", "office", "house"]}
              - {label: "Показать крупной карточкой", name: "featured", widget: "boolean", default: false, required: false}
              - {label: "Фото объекта", name: "image", widget: "image"}
              - {label: "Цена (число)", name: "price", widget: "string"}
              - {label: "Валюта", name: "currency", widget: "string", default: "₼"}

              - label: "Азербайджанский (AZ)"
                name: "az"
                widget: "object"
                fields: &listing_fields
                  - {label: "Название объекта", name: "title", widget: "string"}
                  - {label: "Адрес / район", name: "addr", widget: "string"}
                  - {label: "Характеристика 1 (напр. «2 комнаты»)", name: "spec1", widget: "string", required: false}
                  - {label: "Характеристика 2 (напр. «75 м²»)", name: "spec2", widget: "string", required: false}
                  - {label: "Характеристика 3 (напр. «5/12 этаж»)", name: "spec3", widget: "string", required: false}

              - label: "Русский (RU)"
                name: "ru"
                widget: "object"
                fields: *listing_fields

              - label: "Английский (EN)"
                name: "en"
                widget: "object"
                fields: *listing_fields
